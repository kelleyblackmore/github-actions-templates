# API Documentation Generation Workflow
# Generates and publishes API documentation
# Demonstrates: OpenAPI, documentation generation

name: 46 - API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'openapi/**'
      - 'src/api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: |
          npx @redocly/cli lint openapi/openapi.yaml

      - name: Generate API documentation
        run: |
          npx @redocly/cli build-docs openapi/openapi.yaml -o docs/api.html

      - name: Generate SDK clients
        run: |
          npx openapi-generator-cli generate \
            -i openapi/openapi.yaml \
            -g typescript-axios \
            -o sdk/typescript

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-typescript
          path: sdk/typescript/
