# Manual Workflow Dispatch
# Manually triggered workflow with inputs
# Demonstrates: workflow_dispatch, user inputs

name: 40 - Manual Workflow Dispatch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        type: string
      dry-run:
        description: 'Perform a dry run'
        required: false
        default: false
        type: boolean
      notify-slack:
        description: 'Send Slack notification'
        required: false
        default: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      valid: ${{ steps.validate.outputs.valid }}

    steps:
      - name: Validate version format
        id: validate
        run: |
          if [[ "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "Version format is valid"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "::error::Invalid version format. Expected: vX.Y.Z"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Dry run notice
        if: github.event.inputs.dry-run == 'true'
        run: echo "🔍 This is a DRY RUN - no actual deployment will occur"

      - name: Deploy
        run: |
          echo "Deploying version ${{ github.event.inputs.version }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Dry run: ${{ github.event.inputs.dry-run }}"

      - name: Notify Slack
        if: github.event.inputs.notify-slack == 'true' && github.event.inputs.dry-run == 'false'
        run: echo "Sending Slack notification..."
