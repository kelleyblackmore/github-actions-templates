# Kubernetes Deploy Workflow
# Deploys application to Kubernetes cluster
# Demonstrates: kubectl, Kubernetes deployment

name: 22 - Kubernetes Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  CLUSTER_NAME: my-cluster
  NAMESPACE: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }}

      - name: Set image tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/my-app \
            my-app=ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }} \
            -n ${{ env.NAMESPACE }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/my-app -n ${{ env.NAMESPACE }}
