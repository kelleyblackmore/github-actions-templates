# Scheduled Backup Workflow
# Runs scheduled database backups
# Demonstrates: scheduled workflows, cron syntax

name: 32 - Scheduled Backup

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create database backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="backup_${TIMESTAMP}.sql.gz"
          
          # Create backup using pg_dump
          PGPASSWORD=${{ secrets.DB_PASSWORD }} pg_dump \
            -h ${{ secrets.DB_HOST }} \
            -U ${{ secrets.DB_USER }} \
            -d ${{ secrets.DB_NAME }} | gzip > $BACKUP_FILE

      - name: Upload backup to S3
        run: |
          aws s3 cp $BACKUP_FILE s3://${{ secrets.BACKUP_BUCKET }}/backups/

      - name: Clean up old backups
        run: |
          # Keep only last 30 days of backups
          aws s3 ls s3://${{ secrets.BACKUP_BUCKET }}/backups/ | \
            while read -r line; do
              createDate=$(echo $line | awk {'print $1" "$2'})
              createDate=$(date -d"$createDate" +%s)
              olderThan=$(date -d"-30 days" +%s)
              if [[ $createDate -lt $olderThan ]]; then
                fileName=$(echo $line | awk {'print $4'})
                if [[ $fileName != "" ]]; then
                  aws s3 rm s3://${{ secrets.BACKUP_BUCKET }}/backups/$fileName
                fi
              fi
            done

      - name: Notify on failure
        if: failure()
        run: |
          echo "Backup failed! Please check the logs."
